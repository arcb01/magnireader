name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build MagniReader.csproj -c Release

      # Same publish as the Release workflow, so a release can't ship without the Kokoro voices
      # (the csproj fails the publish if they are missing).
      - name: Publish (as the installer does)
        run: dotnet publish MagniReader.csproj -c Release -r win-x64 --self-contained true -o publish
